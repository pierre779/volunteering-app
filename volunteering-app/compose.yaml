# config file telling docker exactly how to run the mysql environment

services:
  db: # new service defined as "db"
    image: mysql:8.4  # Using this mysql image version
    restart: unless-stopped

    environment:  # .env vars configuring
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-volunteer_tracker}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

    ports:  # maps internal port to internal container port on 3307 [127.0.0.1:3307]
      - "${DB_PORT:-3307}:3306"

    volumes:
      - volunteer_tracker_data:/var/lib/mysql # Storing database data
      - ./database/init:/docker-entrypoint-initdb.d:ro  # Provides the init scripts (read only)

    healthcheck:  # Periodically checks whether MySQL is responding 
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  volunteer_tracker_data:
